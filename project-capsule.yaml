schema_version: c2.project-capsule.v1
identity:
  project_id: 92
  slug: github-autosync
  repository_id: R0092
scope:
  purpose: Synchronize and integrate an explicit allowlist of gernalix GitHub repositories
    from Fedora.
  boundaries:
  - MegaVault owns project and repository identity and registry facts.
  - Project Git/GitHub owns backlog; local task-state exists only during execution.
  - This repository does not manage repositories outside ALLOWED_REPOSITORIES.
repository:
  canonical_workdir: /home/daniele/projects/github-autosync
  branch_policy: main is canonical and protected; make changes in isolated task/*
    worktrees and integrate through repo-integrator.
architecture:
  summary: github_autosync.py orchestrates allowlisted synchronization through autosync_core.py;
    repo_single_writer.py creates isolated task branches and queues integration PRs;
    repo_integrator.py serializes integration; runtime_watchdog.py recovers the local
    service installation. activity_journal.py owns append-only event normalization
    and cursor persistence separately from transport; queued PR follow-ups are serialized
    with the integrator and may only append committed clean descendants to the same
    verified open PR.
  entrypoints:
  - github_autosync.py
  - repo_single_writer.py
  - retired_git_sources.py
  - repo_integrator.py
  - runtime_watchdog.py
  important_paths:
  - github_credentials.py
  - private_bootstrap.py
  - systemd
  - tests
  - README.md
  - activity_journal.py
  - autosync_errors.py
  - repo_gc.py
dependencies:
- name: MegaVault
  project_id: 23
  purpose: Canonical project and repository registry and external runtime state inventory.
data:
  schema: No application database lives in this repository. Runtime state is external
    JSON; the mutation activity ledger is external JSONL under /home/daniele/.local/state/codex-github-autosync.
  migrations: Not applicable; there is no repository-local database schema.
runtime:
  services:
  - github-autosync.service
  - repo-integrator.service
  - github-autosync-watchdog.service
  timers:
  - github-autosync.timer
  - repo-integrator.timer
  - github-autosync-watchdog.timer
  containers: []
devices: []
