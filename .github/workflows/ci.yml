name: CI

on:
  push:
    branches: [main, task/P118-host-aware-source]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: github-autosync-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: >-
      ${{
        github.repository == 'gernalix/github-autosync' &&
        (github.ref == 'refs/heads/task/P118-host-aware-source' || github.head_ref == 'task/P118-host-aware-source') &&
        'p118-github-autosync-source' ||
        'ubuntu-latest'
      }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m py_compile autosync_core.py github_autosync.py repo_single_writer.py repo_integrator.py runtime_watchdog.py install_global_command.py install_systemd.py
