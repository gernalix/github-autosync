safety:
  invariants:
  - Only repositories in ALLOWED_REPOSITORIES are synchronized by the service.
  - Canonical branches remain protected; repo-integrator serializes final repository
    integration.
  - C3 is a frozen archive; no active Git operation depends on its runtime.
  - Git recovery preserves dirty or divergent user work.
  - Queued follow-ups preserve the published ancestry and exact open PR ownership,
    use normal non-force push, and require exact remote readback before clearing stale
    integration failures.
  - A closed unmerged PR stays superseded, never merged. Explicit equivalent-source
    retirement requires every patch integrated and byte-identical affected paths;
    ref collection additionally requires a verified private bundle and preserved original
    checkout.
  risky_operations:
  - install_systemd.py changes installed user commands and systemd units; use only
    for an explicitly requested install or deployment.
  - Forced github-reconcile performs network reconciliation and may push clean ahead-only
    branches; keep it separate from dry-run checks.
  - Runtime state and activity logs live outside Git and must not be reset or replaced
    during repository work.
  recovery:
  - Inspect the installed units and journal, then use runtime_watchdog.py or the documented
    watchdog timer to recover a clean fast-forwardable installation.
  - Keep task worktrees and checkpoints when integration is deferred; never resolve
    divergence by resetting or force-pushing.
acceptance:
- FAST and FULL capsule checks pass with MegaVault identity verified.
- Targeted regression tests pass before the capsule is integrated.
- Repository integration and the resulting canonical head are read back before reporting
  completion.
