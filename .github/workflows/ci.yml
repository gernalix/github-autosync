name: CI

on:
  push:
    branches: [main, task/P118-host-aware-source, task/P118-remote-only-source]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: github-autosync-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: >-
      ${{
        (github.repository == 'gernalix/github-autosync' && startsWith(vars.CI_CUTOVER_JIT_LABEL, 'p174-sync-') && vars.CI_CUTOVER_HEAD_SHA != '' && ((github.event_name == 'push' && github.sha == vars.CI_CUTOVER_HEAD_SHA) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha == vars.CI_CUTOVER_HEAD_SHA))) && vars.CI_CUTOVER_JIT_LABEL ||
        github.repository == 'gernalix/github-autosync' &&
        (github.ref == 'refs/heads/task/P118-host-aware-source' || github.head_ref == 'task/P118-host-aware-source') &&
        'p118-github-autosync-source' ||
        github.repository == 'gernalix/github-autosync' &&
        (github.ref == 'refs/heads/task/P118-remote-only-source' || github.head_ref == 'task/P118-remote-only-source') &&
        'p118-github-autosync-remote-only' ||
        'ubuntu-latest'
      }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ (github.repository == 'gernalix/github-autosync' && startsWith(vars.CI_CUTOVER_JIT_LABEL, 'p174-sync-') && vars.CI_CUTOVER_HEAD_SHA != '' && ((github.event_name == 'push' && github.sha == vars.CI_CUTOVER_HEAD_SHA) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha == vars.CI_CUTOVER_HEAD_SHA))) && vars.CI_CUTOVER_HEAD_SHA || github.sha }}
      - name: Verify cutover JIT checkout
        if: ${{ github.repository == 'gernalix/github-autosync' && startsWith(vars.CI_CUTOVER_JIT_LABEL, 'p174-sync-') && vars.CI_CUTOVER_HEAD_SHA != '' && ((github.event_name == 'push' && github.sha == vars.CI_CUTOVER_HEAD_SHA) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha == vars.CI_CUTOVER_HEAD_SHA)) }}
        env:
          EXPECTED_SHA: ${{ vars.CI_CUTOVER_HEAD_SHA }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m py_compile autosync_core.py github_autosync.py repo_single_writer.py repo_integrator.py runtime_watchdog.py install_global_command.py install_systemd.py
